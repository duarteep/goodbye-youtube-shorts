name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  package:
    name: Package & Release
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Create extension zip
        run: |
          zip -r goodbye-youtube-shorts-${{ github.ref_name }}.zip \
            manifest.json \
            content.js \
            background.js \
            popup.js \
            popup.html \
            _locales/ \
            icon.png \
            icon16.png \
            icon48.png \
            icon128.png

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: extension-${{ github.ref_name }}
          path: '*.zip'
          retention-days: 90

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: '*.zip'
          generate_release_notes: true
